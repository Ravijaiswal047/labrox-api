openapi: 3.1.0
info:
  title: LabRox IAM & Security Service API
  version: 1.0.0
  description: Authentication, session management, RBAC, and 21 CFR Part 11 audit trail service.
servers:
  - url: http://localhost:8080/api/v1/iam
    description: API Gateway
paths:
  /login:
    post:
      summary: Authenticate user and issue access token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: "admin"
                password:
                  type: string
                  format: password
                  example: "Admin@1234"
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
  /switch-centre:
    post:
      summary: Switch current operational centre for active session
      operationId: switchCentre
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [centreId]
              properties:
                centreId:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Centre switched; updated JWT returned
  /menu/main-menu:
    get:
      summary: Retrieve dynamic RBAC menu tree for user designation
      operationId: getMainMenu
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dynamic menu items matching user privileges
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            userId:
              type: integer
            userName:
              type: string
            companyId:
              type: integer
            designationId:
              type: integer
            defaultCentreId:
              type: integer
