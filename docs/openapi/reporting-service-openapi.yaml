openapi: 3.1.0
info:
  title: LabRox Reporting & Document Generation API
  version: 1.0.0
  description: Clinical laboratory report rendering (PDF/HTML), receipts, and Excel MIS workbooks.
paths:
  /reports/clinical/{labNo}:
    get:
      summary: Retrieve approved clinical lab report PDF
      parameters:
        - name: labNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PDF byte stream or pre-signed S3 download URL
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /reports/receipt/{orderId}:
    get:
      summary: Retrieve patient billing receipt
      responses:
        '200':
          description: Thermal slip or A4 invoice PDF
