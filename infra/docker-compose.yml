version: '3.8'

services:
  # ===========================================================================
  # 1. CORE DATA PLATFORM INFRASTRUCTURE
  # ===========================================================================
  labrox-postgres:
    image: postgres:16-alpine
    container_name: labrox-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labrox_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-LabRoxSecurePassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-labrox_lims}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labrox_admin -d labrox_lims"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - labrox-net

  labrox-redis:
    image: redis:7-alpine
    container_name: labrox-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-LabRoxRedisSecure2026!}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "LabRoxRedisSecure2026!", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - labrox-net

  labrox-opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: labrox-opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - labrox-net

  labrox-kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: labrox-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://labrox-kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@labrox-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - labrox-net

  labrox-minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: labrox-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-labrox_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-LabRoxMinioSecure2026!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - labrox-net

  # ===========================================================================
  # 2. MICROSERVICES APPLICATION LAYER
  # ===========================================================================
  labrox-gateway-service:
    build:
      context: ../labrox-backend/labrox-gateway-service
      dockerfile: Dockerfile
    container_name: labrox-gateway-service
    restart: always
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - labrox-iam-service
      - labrox-order-service
      - labrox-sample-service
    networks:
      - labrox-net

  labrox-iam-service:
    build:
      context: ../labrox-backend/labrox-iam-service
      dockerfile: Dockerfile
    container_name: labrox-iam-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://labrox-postgres:5432/labrox_lims?currentSchema=iam_schema
      SPRING_DATASOURCE_USERNAME: labrox_admin
      SPRING_DATASOURCE_PASSWORD: LabRoxSecurePassword2026!
    depends_on:
      labrox-postgres:
        condition: service_healthy
    networks:
      - labrox-net

  labrox-test-catalog-service:
    build:
      context: ../labrox-backend/labrox-test-catalog-service
      dockerfile: Dockerfile
    container_name: labrox-test-catalog-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://labrox-postgres:5432/labrox_lims?currentSchema=catalog_schema
      SPRING_DATASOURCE_USERNAME: labrox_admin
      SPRING_DATASOURCE_PASSWORD: LabRoxSecurePassword2026!
    depends_on:
      labrox-postgres:
        condition: service_healthy
    networks:
      - labrox-net

  labrox-sample-service:
    build:
      context: ../labrox-backend/labrox-sample-service
      dockerfile: Dockerfile
    container_name: labrox-sample-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://labrox-postgres:5432/labrox_lims?currentSchema=sample_schema
      SPRING_DATASOURCE_USERNAME: labrox_admin
      SPRING_DATASOURCE_PASSWORD: LabRoxSecurePassword2026!
    depends_on:
      labrox-postgres:
        condition: service_healthy
    networks:
      - labrox-net

  labrox-diagnostic-service:
    build:
      context: ../labrox-backend/labrox-diagnostic-service
      dockerfile: Dockerfile
    container_name: labrox-diagnostic-service
    restart: always
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://labrox-postgres:5432/labrox_lims?currentSchema=diagnostic_schema
      SPRING_DATASOURCE_USERNAME: labrox_admin
      SPRING_DATASOURCE_PASSWORD: LabRoxSecurePassword2026!
    depends_on:
      labrox-postgres:
        condition: service_healthy
    networks:
      - labrox-net

  labrox-qc-service:
    build:
      context: ../labrox-backend/labrox-qc-service
      dockerfile: Dockerfile
    container_name: labrox-qc-service
    restart: always
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://labrox-postgres:5432/labrox_lims?currentSchema=qc_schema
      SPRING_DATASOURCE_USERNAME: labrox_admin
      SPRING_DATASOURCE_PASSWORD: LabRoxSecurePassword2026!
    depends_on:
      labrox-postgres:
        condition: service_healthy
    networks:
      - labrox-net

  labrox-approval-service:
    build:
      context: ../labrox-backend/labrox-approval-service
      dockerfile: Dockerfile
    container_name: labrox-approval-service
    restart: always
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://labrox-postgres:5432/labrox_lims?currentSchema=workflow_schema
      SPRING_DATASOURCE_USERNAME: labrox_admin
      SPRING_DATASOURCE_PASSWORD: LabRoxSecurePassword2026!
    depends_on:
      labrox-postgres:
        condition: service_healthy
    networks:
      - labrox-net

  labrox-cron-orchestrator:
    build:
      context: ../labrox-backend/labrox-cron-orchestrator
      dockerfile: Dockerfile
    container_name: labrox-cron-orchestrator
    restart: always
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://labrox-postgres:5432/labrox_lims?currentSchema=cron_schema
      SPRING_DATASOURCE_USERNAME: labrox_admin
      SPRING_DATASOURCE_PASSWORD: LabRoxSecurePassword2026!
    depends_on:
      labrox-postgres:
        condition: service_healthy
    networks:
      - labrox-net

  labrox-order-service:
    build:
      context: ../labrox-backend/labrox-order-service
      dockerfile: Dockerfile
    container_name: labrox-order-service
    restart: always
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://labrox-postgres:5432/labrox_lims?currentSchema=order_schema
      SPRING_DATASOURCE_USERNAME: labrox_admin
      SPRING_DATASOURCE_PASSWORD: LabRoxSecurePassword2026!
    depends_on:
      labrox-postgres:
        condition: service_healthy
    networks:
      - labrox-net

  labrox-reporting-service:
    build:
      context: ../labrox-backend/labrox-reporting-service
      dockerfile: Dockerfile
    container_name: labrox-reporting-service
    restart: always
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://labrox-postgres:5432/labrox_lims?currentSchema=reporting_schema
      SPRING_DATASOURCE_USERNAME: labrox_admin
      SPRING_DATASOURCE_PASSWORD: LabRoxSecurePassword2026!
    depends_on:
      labrox-postgres:
        condition: service_healthy
    networks:
      - labrox-net

  # ===========================================================================
  # 3. PRODUCTION REACT FRONTEND
  # ===========================================================================
  labrox-frontend:
    build:
      context: ../labrox-frontend
      dockerfile: Dockerfile
    container_name: labrox-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - labrox-gateway-service
    networks:
      - labrox-net

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  kafka_data:
  minio_data:

networks:
  labrox-net:
    driver: bridge
