server:
  port: 8086

spring:
  application:
    name: labrox-approval-service
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:labrox_lims}?currentSchema=approval_schema
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: approval_schema
        format_sql: false
  flyway:
    enabled: true
    schemas: approval_schema
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
