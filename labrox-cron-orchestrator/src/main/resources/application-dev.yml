server:
  port: 8087

spring:
  datasource:
    url: jdbc:h2:mem:labrox_cron;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS cron_schema\;CREATE SCHEMA IF NOT EXISTS diagnostic_schema\;CREATE SCHEMA IF NOT EXISTS catalog_schema
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false
  quartz:
    job-store-type: memory
